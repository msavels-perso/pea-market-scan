name: Daily Market Scan

on:
  schedule:
    - cron: '30 6 * * 1-5'   # 8h30 Paris (UTC+2 été) — lundi au vendredi
  workflow_dispatch:           # permet de lancer manuellement depuis GitHub

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance pandas numpy -q

      - name: Run market scan
        run: python market_scan.py
